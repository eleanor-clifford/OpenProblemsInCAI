training_data: data/processed/misc/arena2025_arena-human-preference-140k_5000chars_english_no-sep-prompt_800samples_train_ap.json
test_data: data/processed/misc/arena2025_arena-human-preference-140k_5000chars_english_no-sep-prompt_400samples_test_ap.json
continue_from:
  step: blended_discovery
  blend:
    sources:
      - exp/saved_outputs/arena/deepseek/icai
      - exp/saved_outputs/arena/gemini/icai
      - exp/saved_outputs/arena/gpt4o/icai
      - exp/saved_outputs/arena/gpt4o-mini/icai
      - exp/saved_outputs/arena/gpt5.4-mini/icai
      - exp/saved_outputs/arena/gpt5.4-nano/icai
    select:
      order_by: random
      max_principles: 10
      require_max_principles: true
      filter_majority_true: false
      filter_min_relevance: 0

annotation:
  - model: openrouter/deepseek/deepseek-chat-v3.1
    batch_size: 10
    num_votes_per_annotation: 1
    max_tokens: 3000

  - model: openrouter/google/gemini-2.5-flash
    batch_size: 10
    num_votes_per_annotation: 1

  - model: openrouter/openai/gpt-4o
    batch_size: 10
    num_votes_per_annotation: 1

  - model: openrouter/openai/gpt-4o-mini-2024-07-18
    batch_size: 10
    num_votes_per_annotation: 1

  - model: openrouter/openai/gpt-5.4-mini
    batch_size: 10
    num_votes_per_annotation: 1

  - model: openrouter/openai/gpt-5.4-nano
    batch_size: 10
    num_votes_per_annotation: 1

constitutional_annotator:
  method: dummy
