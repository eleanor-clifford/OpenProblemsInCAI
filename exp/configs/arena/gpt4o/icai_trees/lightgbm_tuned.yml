training_data: data/processed/misc/arena2025_arena-human-preference-140k_5000chars_english_no-sep-prompt_800samples_train_ap.json
test_data: data/processed/misc/arena2025_arena-human-preference-140k_5000chars_english_no-sep-prompt_400samples_test_ap.json
continue_from:
  step: annotation
  exp_dir: exp/saved_outputs/arena/gpt4o/icai
  reannotate_invalid: true
  copy_files: false

annotation:
  use_all_annotators_if_none_selected: true
  model: openrouter/openai/gpt-4o
  num_votes_per_annotation: 1
  use_all_annotators_if_none_selected: true
  conflict_strategy: unanimous

constitutional_annotator:
  method: tree
  tree_annotator:
    type: LightGBM
    tuning:
      enabled: true
      n_trials: 40

plotting:
  generate: false
