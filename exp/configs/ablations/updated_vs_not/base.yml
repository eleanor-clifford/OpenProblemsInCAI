training_data: ${TRAIN_DATA}
test_data: ${TEST_DATA}
continue_from:
  step: annotation
  exp_dir: ${EXP_DIR}
  copy_files: false

annotation:
  model: null
  num_votes_per_annotation: 1
  conflict_strategy: unanimous

constitutional_annotator:
  method: flat
  flat_annotator:
    aggregation: majority
    model: null
    selection:
      num_clusters: 100
      max_principles: 10
      require_max_principles: true
      order_by: majority_perf
      filter_min_relevance: 0
      filter_majority_true: false
      allowed_annotator_ids: ${ALLOWED_IDS}

plotting:
  generate: false
