training_data: data/alpaca_eval_train.json
test_data: data/alpaca_eval_test.json
continue_from:
  step: blended_discovery
  blend:
    sources:
      - exp/saved_outputs/alpaca_eval/deepseek/icai_plus
      - exp/saved_outputs/alpaca_eval/gemini/icai_plus
      - exp/saved_outputs/alpaca_eval/gpt4o/icai_plus
      - exp/saved_outputs/alpaca_eval/gpt4o-mini/icai_plus
      - exp/saved_outputs/alpaca_eval/gpt5.4-mini/icai_plus
      - exp/saved_outputs/alpaca_eval/gpt5.4-nano/icai_plus
    select:
      order_by: random
      max_principles: 10
      require_max_principles: true
      filter_majority_true: false
      filter_min_relevance: 0

annotation:
  - model: openrouter/deepseek/deepseek-chat-v3.1
    batch_size: 10
    num_votes_per_annotation: 1
    max_tokens: 3000

  - model: openrouter/google/gemini-2.5-flash
    batch_size: 10
    num_votes_per_annotation: 1

  - model: openrouter/openai/gpt-4o
    batch_size: 10
    num_votes_per_annotation: 1

  - model: openrouter/openai/gpt-4o-mini-2024-07-18
    batch_size: 10
    num_votes_per_annotation: 1

  - model: openrouter/openai/gpt-5.4-mini
    batch_size: 10
    num_votes_per_annotation: 1

  - model: openrouter/openai/gpt-5.4-nano
    batch_size: 10
    num_votes_per_annotation: 1

constitutional_annotator:
  method: dummy
